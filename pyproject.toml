[build-system]
requires = ['setuptools', 'wheel']
build-backend = 'setuptools.build_meta'


[project]
name = "pagaia"
readme = { "file" = "README.md", "content-type" = "text/markdown" }
license-files = ["LICEN[CS]E*"]
authors = [{ name = "João Faria", email = "joao.faria@unige.ch" }]
description = "Python tools for the analysis of Gaia data"
requires-python = ">=3.12"
classifiers = ["Programming Language :: Python :: 3"]
dependencies = [
    "numpy",
    "scipy",
    "astropy",
    "astroquery",
]

dynamic = ["version"]

[tool.setuptools.packages.find]
where = [".", "pagaia"]
include = ["pagaia*"]

[project.optional-dependencies]
dev = ["pytest"]


[project.urls]
homepage = "https://pagaia.org/"
documentation = "https://github.com/j-faria/pagaia/docs"
repository = "https://github.com/j-faria/pagaia"
changelog = "https://github.com/j-faria/pagaia/blob/main/CHANGES.md"
